# dida-trade, containerized. Runs unchanged under `docker compose` and
# `podman compose`.
#
# All replicas live in ONE container by design: Paxos peers are addressed as
# localhost:<base_port + id> in DidaTradeServerState, so they have to share a
# network namespace. app and console join that same namespace via
# network_mode, which is why they keep passing "localhost" exactly as the
# README describes.

services:
  replicas:
    build:
      context: .
      dockerfile: Containerfile
    image: didatrade:dev
    init: true
    environment:
      BASE_PORT: "20000"
      SCHEDULE: "A"
      REPLICAS: "3"
    command: ["/work/scripts/run-replicas.sh"]
    volumes:
      - ./src:/work/src
      - ./scripts:/work/scripts:ro
      - m2:/root/.m2
    ports:
      - "20000-20002:20000-20002"

  # Interactive; started with `./dev.sh app`, not by `up`.
  app:
    image: didatrade:dev
    profiles: ["tools"]
    depends_on: [replicas]
    network_mode: "service:replicas"
    stdin_open: true
    tty: true
    working_dir: /work/src/app
    command: ["mvn", "exec:java", "-Dexec.args=1 localhost 20000 A"]
    volumes:
      - ./src:/work/src
      - m2:/root/.m2

  # Ballot/debug commands to the replicas: crash, freeze, un-freeze, slow-mode.
  console:
    image: didatrade:dev
    profiles: ["tools"]
    depends_on: [replicas]
    network_mode: "service:replicas"
    stdin_open: true
    tty: true
    working_dir: /work/src/console
    command: ["mvn", "exec:java", "-Dexec.args=localhost 20000 A"]
    volumes:
      - ./src:/work/src
      - m2:/root/.m2

  # Plain dev shell: JDK 22 + Maven, source bind-mounted, own network so it can
  # run the full three-replica setup by hand without clashing with `up`.
  shell:
    image: didatrade:dev
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Containerfile
    stdin_open: true
    tty: true
    command: ["bash"]
    volumes:
      - ./src:/work/src
      - ./scripts:/work/scripts:ro
      - m2:/root/.m2

volumes:
  m2:
