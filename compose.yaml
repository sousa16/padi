# dida-trade, containerized. Runs unchanged under `docker compose` and
# `podman compose`. Drive it through ./dev.sh rather than by hand.
#
# Every replica joins the network namespace of the `net` service. That is not a
# convenience: DidaTradeServerState addresses peers as
# localhost:<base_port + id>, so replicas that did not share a namespace would
# never reach each other. Sharing one namespace keeps that assumption true while
# still giving each replica its own container, and therefore its own lifecycle --
# which is what Step 5 needs, since state transfer is only observable when a
# replica can be stopped and brought back while the others keep running.
#
# Schedules: A and B use replicas 0-2, C uses 0-6 (acceptors change from
# {0,1,2,3,4} to {2,3,4,5,6} at Config3). SCHEDULE is set by dev.sh.

x-replica: &replica
  image: didatrade:dev
  init: true
  depends_on: [net]
  network_mode: "service:net"
  entrypoint: ["/work/scripts/replica.sh"]
  environment:
    BASE_PORT: "${BASE_PORT:-20000}"
    SCHEDULE: "${SCHEDULE:-A}"
  volumes:
    - ./src:/work/src
    - ./scripts:/work/scripts:ro
    - m2:/root/.m2

x-tool: &tool
  image: didatrade:dev
  profiles: ["tools"]
  depends_on: [net]
  network_mode: "service:net"
  stdin_open: true
  tty: true
  volumes:
    - ./src:/work/src
    - ./scripts:/work/scripts:ro
    - m2:/root/.m2

services:
  # Owns the network namespace and publishes the whole port range that
  # Schedule C can use. Holds no application logic.
  net:
    build:
      context: .
      dockerfile: Containerfile
    image: didatrade:dev
    init: true
    command: ["sleep", "infinity"]
    ports:
      - "20000-20006:20000-20006"

  s0: {<<: *replica, command: ["0"]}
  s1: {<<: *replica, command: ["1"]}
  s2: {<<: *replica, command: ["2"]}

  # Schedule C only. Profiled so a bare `compose up` does not start them;
  # naming one on the command line enables it.
  s3: {<<: *replica, command: ["3"], profiles: ["extended"]}
  s4: {<<: *replica, command: ["4"], profiles: ["extended"]}
  s5: {<<: *replica, command: ["5"], profiles: ["extended"]}
  s6: {<<: *replica, command: ["6"], profiles: ["extended"]}

  app:
    <<: *tool
    working_dir: /work/src/app
    command: ["mvn", "-o", "exec:java", "-Dexec.args=1 localhost ${BASE_PORT:-20000} ${SCHEDULE:-A}"]

  # Ballot/debug commands: crash, freeze, un-freeze, slow-mode, reconfiguration.
  console:
    <<: *tool
    working_dir: /work/src/console
    command: ["mvn", "-o", "exec:java", "-Dexec.args=localhost ${BASE_PORT:-20000} ${SCHEDULE:-A}"]

  # Serial build into the shared Maven volume. Never run concurrently with
  # replicas -- see scripts/build.sh.
  builder:
    image: didatrade:dev
    profiles: ["tools"]
    entrypoint: ["/work/scripts/build.sh"]
    volumes:
      - ./src:/work/src
      - ./scripts:/work/scripts:ro
      - m2:/root/.m2

  # JDK 22 + Maven with the source mounted, own network. For building and
  # poking around by hand.
  shell:
    image: didatrade:dev
    profiles: ["tools"]
    stdin_open: true
    tty: true
    command: ["bash"]
    volumes:
      - ./src:/work/src
      - ./scripts:/work/scripts:ro
      - m2:/root/.m2

volumes:
  m2:
