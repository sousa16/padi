//
// Protocol buffers definition for DidaTrade Paxos Service
//
syntax = "proto3";
package didatrade;

// Multi-Paxos: phase 1 runs once per ballot and covers every instance from
// `instance` onwards, so the acceptor answers with its log from that point.
message PhaseOneRequest {
  int32 instance        = 1;
  int32 requestballot	= 2;
}

// One accepted (or decided) value in an acceptor's log.
message LogEntry {
  int32 position     = 1;
  int32 ballot       = 2;
  int32 command_id   = 3;
}

message PhaseOneReply {
  int32 instance        = 1;
  int32 serverid        = 2;
  int32 requestballot	= 3;
  bool  accepted 	= 4;
  int32 value           = 5;
  int32 valballot       = 6;
  int32 maxballot       = 7;
  repeated LogEntry log  = 8;
}

// In a fast ballot, `any` is the leader telling everyone that every instance
// from `instance` onwards is open: any proposer may send its own value there
// directly to the acceptors. It carries no value and is not a vote.
message PhaseTwoRequest {
  int32 instance        = 1;
  int32 requestballot   = 2;
  int32 value           = 3;
  bool  any             = 4;
}

message PhaseTwoReply {
  int32 instance        = 1;
  int32 serverid        = 2;
  int32 requestballot   = 3;
  bool  accepted        = 4;
  int32 maxballot       = 5;
}

// Sent by an acceptor to every learner each time it votes. `serverid` lets a
// learner count each acceptor once per value, which fast ballots need because
// acceptors may vote for different values in the same instance.
message LearnRequest {
  int32 instance   = 1;
  int32 ballot     = 2;
  int32 value      = 3;
  int32 serverid   = 4;
}

message LearnReply {
  int32 instance   = 1;
  int32 ballot     = 2;
}

service DidaTradePaxosService {
  rpc phaseone (PhaseOneRequest) returns (PhaseOneReply);
  rpc phasetwo (PhaseTwoRequest) returns (PhaseTwoReply);
  rpc learn    (LearnRequest)    returns (LearnReply);
}






