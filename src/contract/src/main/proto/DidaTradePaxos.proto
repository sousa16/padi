//
// Protocol buffers definition for DidaTrade Paxos Service
//
syntax = "proto3";
package didatrade;

// Multi-Paxos: phase 1 runs once per ballot and covers every instance from
// `instance` onwards, so the acceptor answers with its log from that point.
message PhaseOneRequest {
  int32 instance        = 1;
  int32 requestballot	= 2;
}

// One accepted (or decided) value in an acceptor's log. A decided value is
// final, whatever its ballot, so the new leader must keep it.
message LogEntry {
  int32 position     = 1;
  int32 ballot       = 2;
  int32 command_id   = 3;
  bool  decided      = 4;
}

message PhaseOneReply {
  int32 instance        = 1;
  int32 serverid        = 2;
  int32 requestballot	= 3;
  bool  accepted 	= 4;
  int32 value           = 5;
  int32 valballot       = 6;
  int32 maxballot       = 7;
  repeated LogEntry log  = 8;
}

// In a fast ballot, `any` is the leader telling everyone that every instance
// from `instance` onwards is open: any proposer may send its own value there
// directly to the acceptors. It carries no value and is not a vote.
message PhaseTwoRequest {
  int32 instance        = 1;
  int32 requestballot   = 2;
  int32 value           = 3;
  bool  any             = 4;
  // In a fast ballot, the acceptor assigns the request to its lowest open slot.
  bool  allocate        = 5;
}

message PhaseTwoReply {
  int32 instance        = 1;
  int32 serverid        = 2;
  int32 requestballot   = 3;
  bool  accepted        = 4;
  int32 maxballot       = 5;
}

// Sent by an acceptor to every learner each time it votes. `serverid` lets a
// learner count each acceptor once per value, which fast ballots need because
// acceptors may vote for different values in the same instance.
message LearnRequest {
  int32 instance   = 1;
  int32 ballot     = 2;
  int32 value      = 3;
  int32 serverid   = 4;
}

message LearnReply {
  int32 instance   = 1;
  int32 ballot     = 2;
}

// Step 5, state transfer. A decided log position together with the command
// itself: a replica that missed the client request (or restarted and lost it)
// cannot execute a bare command id. command_id -1 is a no-op, with no body.
message DecidedCommand {
  int32 position     = 1;
  int32 ballot       = 2;
  int32 command_id   = 3;
  int32 action       = 4;
  int32 userid       = 5;
  int32 quantity     = 6;
  int32 stock        = 7;
}

// Pull: a replica that is behind (or just restarted) asks a peer for every
// decided position from `from_instance` onwards.
message FetchStateRequest {
  int32 from_instance = 1;
  int32 serverid      = 2;
}

message FetchStateReply {
  int32 serverid      = 1;
  int32 ballot        = 2;   // the peer's current ballot
  int32 executed      = 3;   // log positions the peer has executed
  bool  has_votes     = 4;   // the peer has voted at least once as an acceptor
  repeated DecidedCommand commands = 5;
}

// Push: the leader of a ballot whose acceptor set changed hands the decided
// log to the new acceptors before declaring the ballot complete.
message InstallStateRequest {
  int32 ballot        = 1;
  int32 serverid      = 2;
  repeated DecidedCommand commands = 3;
}

message InstallStateReply {
  int32 serverid      = 1;
  bool  ack           = 2;
}

service DidaTradePaxosService {
  rpc phaseone (PhaseOneRequest) returns (PhaseOneReply);
  rpc phasetwo (PhaseTwoRequest) returns (PhaseTwoReply);
  rpc learn    (LearnRequest)    returns (LearnReply);
  rpc fetchstate   (FetchStateRequest)   returns (FetchStateReply);
  rpc installstate (InstallStateRequest) returns (InstallStateReply);
}





